<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--pri:#18202E;--acc:#D62828;--bg:#f2f4f8;--card:#fff;--line:#e3e7ee;--txt:#1b2437;--mut:#667085;
    --green:#1E8449;--greenbg:#E3F4EA;--red:#C0392B;--redbg:#FBE5E2;--amber:#B9770E;--amberbg:#FDF1D6;--blue:#1F5FBF;--bluebg:#E1ECFB}
  *{box-sizing:border-box}
  body{margin:0;font-family:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:13px}
  .app{display:grid;grid-template-columns:232px 1fr;height:100vh}
  .side{background:var(--pri);color:#cfd6e4;padding:16px 12px;display:flex;flex-direction:column;gap:3px;overflow:auto;border-right:4px solid var(--acc)}
  .logobox{background:#fff;border-radius:12px;padding:8px;text-align:center;margin-bottom:10px}
  .logobox img{max-width:100%;max-height:96px;display:block;margin:0 auto}
  .bname{color:#D4AF37;font-family:"Copperplate Gothic Bold","Copperplate Gothic Light","Copperplate","Copperplate Gothic",Georgia,serif;font-weight:700;font-size:14px;letter-spacing:.5px;padding:2px 8px}
.btag{color:#fff;font-family:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif;font-weight:400;font-size:12px;letter-spacing:0;padding:0 8px 14px}
  .navlbl{font-size:11px;color:#8391ab;padding:10px 10px 4px}
  .nav{padding:9px 12px;border-radius:8px;cursor:pointer;display:block;color:#cfd6e4;user-select:none;border-left:3px solid transparent}
  .nav:hover{background:rgba(255,255,255,.08)}
  .nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:600;border-left-color:var(--acc)}
  .who{margin-top:auto;padding:12px 8px 2px;font-size:11px;color:#9aa6bd;word-break:break-all;border-top:1px solid rgba(255,255,255,.12)}
  .main{padding:20px 26px;overflow:auto;position:relative}
  .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px;flex-wrap:wrap}
  .top h1{margin:0;font-size:22px;font-weight:700} .top p{margin:4px 0 0;color:var(--mut)}
  .btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px;font-family:inherit}
  .btn:hover{filter:brightness(1.15)} .btn:disabled{opacity:.6;cursor:wait}
  .btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .btn.acc{background:var(--acc)} .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line)}
  .btn.sm{padding:4px 9px;font-size:11px;border-radius:6px}
  .btn.ok{background:var(--green)} .btn.wa{background:#128C7E} .btn.amber{background:var(--amber)}
.btn.danger{background:var(--red)}
.btn.cream{background:#FFF1CC;color:#6b4e0a;border:1px solid #e6cf8f}
.btn.wagreen{background:#25D366}
.btn.dosync{background:#1F5FBF}
.btn.resync{background:#475467}
.wasub{display:none;margin-top:5px}
.wasub.open{display:block}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(4,1fr);margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .kpi{cursor:pointer;border-top:3px solid var(--line)} .kpi:hover{border-top-color:var(--acc)}
  .kpi .l{color:var(--mut);font-size:12px;font-weight:600}
  .kpi .v{font-size:30px;font-weight:700;margin-top:6px} .kpi .s{font-size:11px;margin-top:2px}
  .c2{grid-template-columns:1.6fr 1fr;margin-bottom:14px} .c3{grid-template-columns:1.5fr 1fr 1fr;margin-bottom:14px}
  h3{margin:0 0 10px;font-size:14px}
  table{width:100%;border-collapse:collapse}
  td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;vertical-align:middle}
  th{color:var(--mut);font-weight:600;font-size:11px;position:sticky;top:0;background:#fff}
  tr.click{cursor:pointer} tr.click:hover td{background:#f7f9fd}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
  .p-b{background:var(--bluebg);color:var(--blue)} .p-g{background:var(--greenbg);color:var(--green)}
  .p-r{background:var(--redbg);color:var(--red)} .p-a{background:var(--amberbg);color:var(--amber)} .p-n{background:#eceff5;color:#555}
  .bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
  .bar i{width:70%;background:var(--pri);border-radius:5px 5px 0 0;min-height:3px;display:block}
  .bar b{font-size:11px;margin-bottom:3px} .bar span{font-size:10px;color:var(--mut);margin-top:5px}
  .donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .donut{width:130px;height:130px;border-radius:50%;position:relative;flex:none}
  .donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
  .donut em{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-style:normal;font-weight:700;font-size:22px}
  .leg div{display:flex;align-items:center;gap:7px;margin:5px 0;font-size:12px}
  .leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qa button{border:1px solid var(--line);background:#f8f9fc;border-radius:8px;padding:14px 8px;cursor:pointer;font-weight:600;color:var(--pri);font-family:inherit}
  .qa button:hover{border-color:var(--acc)}
  .row{padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer} .row:last-child{border:0}
  .row small{color:var(--mut);display:block;margin-top:2px}
  .empty{color:var(--mut);padding:18px 0;text-align:center}
  .tools{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
  .tools input,.tools select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
  .tools input{flex:1;max-width:340px}
  .tablewrap{max-height:calc(100vh - 190px);overflow:auto}
  .ov{position:fixed;inset:0;background:rgba(24,32,46,.5);display:flex;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:12px;width:min(860px,94vw);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px}
  .modal .body{padding:16px 20px;overflow:auto}
  .modal footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;align-items:center}
  .x{cursor:pointer;font-size:22px;color:var(--mut);border:0;background:none}
  .form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
  .fld{display:flex;flex-direction:column;gap:4px} .fld.full{grid-column:1/-1}
  .fld label{font-size:12px;font-weight:600;color:var(--mut)} .rq{color:var(--red)}
  .fld input,.fld select,.fld textarea{padding:8px 10px;border:1px solid #cfd6e3;border-radius:7px;font:inherit;background:#fff}
  .fld input[type=color]{padding:2px;height:36px;width:100%}
  .fld textarea{min-height:64px;resize:vertical} .fld small{color:var(--mut);font-size:11px}
  .errbox{color:var(--red);font-weight:600;margin-right:auto;font-size:12px}
  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--pri);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;display:none;max-width:70vw}
  #toast.bad{background:var(--red)}
  .msg{padding:40px;text-align:center;color:var(--mut)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--pri);border-bottom-color:var(--acc)}
  .panel{display:none} .panel.on{display:block}
  .logoedit{display:flex;gap:16px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .logoedit img{width:96px;height:96px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;padding:4px}
  .lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{background:#eef1f6;border-radius:99px;padding:3px 10px;font-size:12px}
  .chip b{cursor:pointer;color:var(--red);margin-left:4px} .chip i{font-style:normal;font-size:10px}
  .ladd{display:flex;gap:6px} .ladd input{flex:1;padding:6px 9px;border:1px solid #cfd6e3;border-radius:7px;font:inherit}
  .hl{padding:8px 0;border-bottom:1px solid var(--line)} .hl small{color:var(--amber);margin-left:6px}
  .savebar{position:sticky;bottom:0;background:var(--bg);padding:12px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  
th.fh{cursor:pointer;user-select:none;white-space:nowrap}
th.fh:hover{color:var(--txt)}
th.fh .fi{margin-left:4px;font-size:10px;opacity:.55}
th.fh.fa{color:var(--acc)} th.fh.fa .fi{opacity:1}
.fmenu{position:fixed;z-index:60;width:270px;max-width:calc(100vw - 16px);max-height:min(72vh,480px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px rgba(0,0,0,.22);padding:12px;font-size:12px;color:var(--txt)}
.fmenu h4{margin:0 0 8px;font-size:12px;color:var(--mut)}
.fmenu input[type=text],.fmenu input[type=date],.fmenu input[type=time]{width:100%;padding:7px 9px;border:1px solid #cfd6e3;border-radius:7px;font:inherit;margin-bottom:8px}
.fmenu label.fl{display:block;font-weight:600;color:var(--mut);margin-bottom:3px}
.fml{max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin-bottom:8px}
.fo{display:flex;gap:7px;align-items:center;padding:4px 0;cursor:pointer}
.fmrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.fmf{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.fmerr{color:var(--red);font-weight:600;margin-bottom:6px}
.fmnote{color:var(--mut);margin:4px 0 8px}

  @media(max-width:900px){
    .app{grid-template-columns:1fr;height:auto}
    .side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:4px solid var(--acc);align-items:center}
    .logobox{margin:0;width:70px} .bname,.btag,.navlbl,.who{display:none} .nav{padding:7px 10px}
    .kpis,.c2,.c3,.form{grid-template-columns:1fr 1fr} .c2,.c3{grid-template-columns:1fr}
    .main{padding:14px;overflow:visible} .tablewrap{max-height:none}
  }
  @media(max-width:560px){.kpis,.form{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .burger{display:none}
@media(max-width:900px){
  .side{display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;position:sticky;top:0;z-index:40}
  .logobox{width:48px;height:48px;padding:3px;margin:0;border-radius:8px;flex:none}
  .logobox img{max-height:42px}
  .bname{display:block;flex:1;padding:0;font-size:15px}
  .btag{display:none}
  .burger{display:block;order:2;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:8px;font-size:22px;line-height:1;padding:8px 14px;cursor:pointer}
  #navhost{display:none;width:100%;order:3}
  .side.open #navhost{display:block}
  .navlbl{display:block}
  .nav{padding:12px}
  .who{display:none;width:100%;order:4;margin-top:6px}
  .side.open .who{display:block}
  .tablewrap table{min-width:980px}
  .tablewrap{-webkit-overflow-scrolling:touch}
  .card{overflow-x:auto}
  .tools input{max-width:none;width:100%}
  .tools select{width:100%}
  .top h1{font-size:18px}
  .bars{gap:6px}
  .tabs{flex-wrap:nowrap;overflow-x:auto}
  .tab{white-space:nowrap}
  .lgrid{grid-template-columns:1fr}
  .ov{align-items:flex-end}
  .modal{width:100%!important;max-width:100vw;max-height:94vh;border-radius:14px 14px 0 0}
  .btn.sm{padding:7px 11px;font-size:12px}
  .fld input,.fld select,.fld textarea,.tools input,.tools select,.fmenu input{font-size:16px}
}
@media(max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:24px}
  .form{grid-template-columns:1fr}
}

#printArea{display:none}
.ptab{width:100%;border-collapse:collapse;font-size:12px}
.ptab th,.ptab td{border:1px solid #999;padding:7px 8px;text-align:left;vertical-align:top;position:static;background:#fff;color:#000}
.ptab th{background:#eee;font-size:12px}
.ptab thead{display:table-header-group}
.ptab tr{page-break-inside:avoid}
@media print{
  .app,#toast,#modalHost,#fmenu{display:none!important}
  #printArea{display:block}
  body{background:#fff}
  @page{margin:12mm}
}
/* ---- START CSS ---- */

/* ===== LIVE INSTRUCTIONS GUIDE ===== */
.tghero{background:var(--pri);color:#fff;border-radius:12px;padding:22px 24px;margin-bottom:16px;border-bottom:4px solid var(--acc)}
.tghero h2{margin:0 0 6px;font-size:21px}
.tghero p{margin:0 0 14px;color:#dbe2f0;line-height:1.55;max-width:760px}
.tgrow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.tgv2{display:flex;gap:6px;align-items:center;color:#fff;font-weight:600;cursor:pointer}
.tgchap{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.tgcard{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.tgcard .tgn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tgcard b{display:block;margin-bottom:3px}
.tgcard p{margin:0 0 8px;color:var(--mut);line-height:1.45;font-size:12px}
.tgnote{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.6;max-width:820px}

/* spotlight on the real screen */
#tgspot{position:fixed;z-index:150;pointer-events:none;display:none;border-radius:10px;box-shadow:0 0 0 9999px rgba(11,18,32,.6);outline:3px solid #f5b400;transition:left .3s ease,top .3s ease,width .3s ease,height .3s ease}

/* player dock */
#tgdock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:160;width:min(780px,calc(100vw - 20px));background:rgba(24,32,46,.97);color:#fff;border-radius:14px;padding:12px 14px 10px;box-shadow:0 12px 40px rgba(0,0,0,.45);border-top:3px solid var(--acc)}
.tgtop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tgtop b{font-size:14px}
.tgtop span{color:#aab6cc;font-size:12px}
.tgx{margin-left:auto;background:none;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
.tgsub{font-size:15px;line-height:1.55;min-height:46px;max-height:30vh;overflow:auto}
.tgbar{height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin:8px 0}
.tgbar i{display:block;height:3px;background:#D4AF37;border-radius:2px;width:0;transition:width .3s}
.tgctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tgb{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px;font-family:inherit}
.tgb:hover{background:rgba(255,255,255,.26)}
.tgb:focus-visible,.tgx:focus-visible{outline:2px solid #D4AF37;outline-offset:1px}
.tgb.pri{background:#D4AF37;color:#2a2100;font-weight:700;min-width:46px}
#tgdock select{background:#fff;color:#1b2437;border:0;border-radius:6px;padding:5px 6px;font:inherit;font-size:12px;max-width:150px}
.tgvl{display:flex;gap:4px;align-items:center;font-size:12px;cursor:pointer}
@media(max-width:700px){
  #tgdock{bottom:6px;padding:10px}
  .tgsub{font-size:14px}
  #tgvsel{display:none}
}
@media print{#tgdock,#tgspot{display:none!important}}
@media(prefers-reduced-motion:reduce){#tgspot,.tgbar i{transition:none!important}}

/* ---- END CSS ---- */
/* ===== MOBILE POLISH ===== */
@media(max-width:900px){
  html,body{overflow-x:clip;max-width:100%}
  .app{display:block;height:auto}
  .main{padding:14px;overflow:visible;min-width:0;max-width:100%}

  /* sticky header that always stays on top */
  .side{position:sticky;top:0;z-index:40;display:flex;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 12px;border-right:0;border-bottom:4px solid var(--acc);overflow:visible}
  .side.open{max-height:100vh;overflow-y:auto}
  .logobox{width:52px;height:52px;padding:3px;margin:0;flex:none;border-radius:10px}
  .logobox img{max-height:44px}
  .brandtxt{flex:1;min-width:0}
  .bname{display:block;padding:0;font-size:16px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btag{display:block;padding:2px 0 0;font-size:11px;color:#dbe2f0;letter-spacing:.3px}

  /* no sideways dragging */
  .top{flex-direction:column;align-items:stretch}
  .top>div{min-width:0;max-width:100%}
  .top>div:last-child{display:flex;flex-wrap:wrap;gap:8px}
  .top p{word-break:break-word}
  .top p b{word-break:break-all}
  .form{grid-template-columns:1fr}
  .lgrid{grid-template-columns:minmax(0,1fr)}
  .savebar{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}

  /* list tables become cards */
  .tablewrap,.tablewrap.card{max-height:none;overflow:visible;background:transparent;border:0;padding:0!important}
  .tablewrap table{min-width:0!important}
  .tablewrap table,.tablewrap tbody,.tablewrap tr,.tablewrap td{display:block;width:100%}
  .tablewrap tr:first-child{display:none}
  .tablewrap tr{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 12px}
  .tablewrap td{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);text-align:right;font-size:13px}
  .tablewrap td::before{content:attr(data-label);flex:none;max-width:40%;text-align:left;font-weight:600;color:var(--mut);font-size:12px}
  .tablewrap td:empty{display:none}
  .tablewrap td:last-child{border-bottom:0;flex-wrap:wrap;justify-content:flex-start;gap:6px;padding-top:10px}
  .tablewrap td:last-child::before{display:none}
  .tablewrap td[colspan]{display:block;text-align:center}
  .wasub.open{display:flex;flex-wrap:wrap;gap:5px;width:100%}
  .btn.sm{padding:8px 12px;font-size:12px}
}
/* ===== COMPACT GUIDE BAR ===== */
#tgdock{left:auto;right:12px;bottom:12px;transform:none;width:min(320px,calc(100vw - 24px));padding:8px 10px;border-radius:12px;opacity:.97}
#tgdock.top{bottom:auto;top:12px}
#tgdock .tgtop{margin-bottom:3px;gap:6px}
#tgdock .tgtop b{font-size:12px}
#tgdock .tgtop span{font-size:11px}
#tgdock .tgx{font-size:16px;padding:0 5px;margin-left:0}
#tgdock #tgmin{margin-left:auto}
#tgdock .tgsub{font-size:12px;line-height:1.45;min-height:0;max-height:none;overflow:hidden;cursor:pointer;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
#tgdock .tgsub.open{display:block;max-height:30vh;overflow:auto}
#tgdock .tgbar{margin:6px 0}
#tgdock .tgb{padding:4px 9px;font-size:13px}
#tgdock .tgset{display:none;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18)}
#tgdock .tgset.open{display:flex}
#tgdock .tgset select{max-width:none;width:100%}

/* minimized pill */
#tgdock.min{display:flex;align-items:center;gap:8px;width:auto;border-radius:99px;padding:5px 8px 5px 12px}
#tgdock.min .tgtop{order:2;margin:0}
#tgdock.min .tgctl{order:1}
#tgdock.min #tgchap,#tgdock.min .tgsub,#tgdock.min .tgbar,#tgdock.min .tgset,#tgdock.min .tgctl .tgb:not(.pri){display:none}

@media(max-width:700px){
  #tgdock{left:6px;right:6px;width:auto;bottom:6px}
  #tgdock.min{left:auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="side">
    <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false">☰</button>
    <div class="logobox"><img id="logo" alt="Company logo"></div>

<script>
/* ============================== helpers ================================= */
var S={boot:null,data:{meeting:[],minutes:[],action:[],followup:[],customer:[]},view:'overview',q:'',flt:'',L:[]};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function call(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(e);});r[fn].apply(r,a);});}
function toast(m,bad){var t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},bad?6000:3200);}
function fmtD(iso){if(!iso)return '';var p=iso.split('-');return p[2]+'-'+MON[+p[1]-1]+'-'+p[0];}
function fmtT(hm){if(!hm)return '';var p=hm.split(':'),h=+p[0],ap=h>=12?'PM':'AM',h12=h%12||12;return (h12<10?'0':'')+h12+':'+p[1]+' '+ap;}
function todayISO(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata'}).format(new Date());}
function addMin(hm,m){var p=hm.split(':'),t=Math.min(+p[0]*60+ +p[1]+m,1439);return ('0'+Math.floor(t/60)).slice(-2)+':'+('0'+t%60).slice(-2);}
function pill(t,c){return '<span class="pill '+c+'">'+esc(t)+'</span>';}
function stCls(s){return {'Completed':'p-g','Finalized':'p-g','Confirmed':'p-g','Received':'p-b','Cancelled':'p-r','Deleted Externally':'p-r','Overdue':'p-r','Pending':'p-a','Request Sent':'p-a','Draft':'p-a','In Progress':'p-b','On Hold':'p-n'}[s]||'p-b';}
function priCls(p){return p==='High'?'p-r':p==='Low'?'p-g':'p-a';}
var COLORS={'Scheduled':'#1F5FBF','Completed':'#1E8449','Cancelled':'#C0392B','Rescheduled':'#B9770E','Deleted Externally':'#8b95a7'};

function applyBrand(b){
  var r=document.documentElement.style;r.setProperty('--pri',b.c1);r.setProperty('--acc',b.c2);
  $('logo').src=b.logo;$('bname').textContent=b.company;$('btag').textContent=b.tagline||'Meeting Scheduler';document.title=b.company+' — Meeting Management';
}
var NAV=[['overview','Overview'],['meeting','Meeting Register'],['minutes','Meeting Minutes'],['action','Action Items'],['followup','Follow-Up Tracker'],['customer','Customers'],
  ['-','SYSTEM'],['sync','Calendar Sync'],['reports','Reports'],['settings','Settings'],['guide','Instructions']];
function buildNav(){
  $('navhost').innerHTML=NAV.map(function(n){return n[0]==='-'?'<div class="navlbl">'+n[1]+'</div>':'<a class="nav" tabindex="0" data-v="'+n[0]+'">'+n[1]+'</a>';}).join('');
  $('who').textContent=(S.boot.user||'')+(S.boot.role?' · '+S.boot.role.toLowerCase():'');
}
$('navhost').addEventListener('click',function(e){var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(v)go(v);});
$('navhost').addEventListener('keydown',function(e){if(e.key==='Enter'){var v=e.target.getAttribute&&e.target.getAttribute('data-v');if(v)go(v);}});

function doneText(r){
  if(r.status!=='Completed'||!r.date)return '';
  var a=r.date.split('-'),b=todayISO().split('-');
  var n=Math.round((Date.UTC(+b[0],+b[1]-1,+b[2])-Date.UTC(+a[0],+a[1]-1,+a[2]))/86400000);
  if(n<0)return 'Marked done early';
  if(n===0)return 'Today';
  if(n===1)return 'Yesterday';
  return n+' days ago';
}
/* ============ follow-up helpers ============ */
function isOpenFu(x){return x.status==='Pending'||x.status==='Rescheduled';}
function byDateAsc(a,b){return a.date<b.date?-1:a.date>b.date?1:0;}
function fuOpenFor(mid){
  return S.data.followup.filter(function(x){return x.meetingId===mid&&isOpenFu(x);}).sort(byDateAsc)[0]||null;
}
function fuColumn(mid){
  var all=S.data.followup.filter(function(x){return x.meetingId===mid&&x.status!=='Cancelled';});
  if(!all.length)return null;
  var open=all.filter(isOpenFu).sort(byDateAsc);
  if(open.length)return open[0];
  return all.sort(function(a,b){return -byDateAsc(a,b);})[0];
}
function fuCell(r){
  var f=fuColumn(r.id);
  if(!f)return '<span style="color:var(--mut)">None</span>';
  var open=isOpenFu(f),late=open&&f.date&&f.date<todayISO();
  var cls=!open?'p-g':late?'p-r':'p-a';
  var label=!open?('Completed '+fmtD(f.completedDate||f.date)):(fmtD(f.date)+' · '+(late?'Overdue':f.status));
  var h='<span onclick="event.stopPropagation()">'+pill(label,cls)+'<br><small style="color:var(--mut)">'+esc((f.subject||'').slice(0,50))+'</small>';
  if(open)h+='<br><button class="btn sm ok" style="margin-top:4px" onclick="doneFollow(\''+f.id+'\',this)">Mark done</button>';
  return h+'</span>';
}
function doneFollow(id,btn){
  btn.disabled=true;btn.textContent='Saving…';
  call('dashSave','followup',{id:id,status:'Completed'}).then(function(r){
    var i=S.data.followup.findIndex(function(x){return x.id===id;});
    if(i>=0)S.data.followup[i]=r.record;
    toast('Follow-up marked done');
    if(S.view==='meeting')renderList('meeting');
  }).catch(function(e){btn.disabled=false;btn.textContent='Mark done';toast(e.message||e,1);});
}
function fuSection(rec){
  var f=rec?fuOpenFor(rec.id):null,L=S.boot.lists;
  function opts(list,sel){return (list||[]).map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
  return '<div class="fld full" style="border-top:1px solid var(--line);padding-top:10px"><label style="font-size:13px;color:var(--pri)">Follow-up (optional)'+(f?' · '+esc(f.id):'')+'</label>'+
    (f?'<small>Saving updates this follow-up. To add a new one, first set this one to Completed.</small>':'')+'</div>'+
    '<input type="hidden" id="f_fuId" value="'+(f?esc(f.id):'')+'">'+
    '<div class="fld"><label>Follow-up date</label><input id="f_fuDate" type="date" value="'+(f?esc(f.date):'')+'"></div>'+
    '<div class="fld"><label>Follow-up type</label><select id="f_fuType">'+opts(L.followType,f?f.type:'Next Meeting')+'</select></div>'+
    '<div class="fld"><label>Follow-up status</label><select id="f_fuStatus">'+opts(L.followStatus,f?f.status:'Pending')+'</select></div>'+
    '<div class="fld full"><label>Follow-up note</label><input id="f_fuSubject" type="text" value="'+(f?esc(f.subject):'')+'" placeholder="e.g. Client will meet on Thursday 3 PM"></div>';
}

/* ============================== schemas ================================= */
var FORMS={
 meeting:[

 customer:[

};

 meeting:function(){var c=S.boot.cfg;return {type:c.defType,priority:c.defPri,mode:c.defMode,locType:c.defLoc,status:'Scheduled',date:todayISO(),start:c.defStart,end:addMin(c.defStart,c.dur)};},
 minutes:function(){return {status:'Draft'};},

var COLS={
  meeting:[['id','ID'],['date','Date',function(r){return fmtD(r.date);}],['start','Time',function(r){return fmtT(r.start);}],['title','Agenda',function(r){return esc((r.title||'').slice(0,80));}],
   ['custName','Customer',function(r){return esc(r.custName||r.company);}],
   ['priority','Type of Customer',function(r){return pill(r.priority,priCls(r.priority));}],
   ['status','Status',function(r){return pill(r.status,stCls(r.status));}],
   ['done','Completed',function(r){return esc(doneText(r));}],
   ['fu','Follow-Up',function(r){return fuCell(r);}],
   ['locStatus','Location',function(r){return r.locStatus?pill(r.locStatus,stCls(r.locStatus)):'';}],
   ['syncStatus','Sync',function(r){return syncCell(r);}]],
 minutes:[['id','ID'],['date','Date',function(r){return fmtD(r.date);}],['title','Meeting'],['summary','Summary',function(r){return esc((r.summary||'').slice(0,90));}],
   ['status','Status',function(r){return pill(r.status,stCls(r.status));}],['recordedBy','By']],
 action:[['id','ID'],['task','Task'],['assignedTo','Assigned to'],['priority','Priority',function(r){return pill(r.priority,priCls(r.priority));}],
   ['deadline','Deadline',function(r){var late=r.deadline&&r.deadline<todayISO()&&r.status!=='Completed';return late?pill(fmtD(r.deadline),'p-r'):fmtD(r.deadline);}],
   ['status','Status',function(r){return pill(r.status,stCls(r.status));}],['title','Meeting']],
 followup:[['id','ID'],['subject','Subject'],['meetingId','Meeting',function(r){var m=S.data.meeting.filter(function(x){return x.id===r.meetingId;})[0];return m?esc(fmtD(m.date)+' · '+(m.title||'').slice(0,40)):'—';}],['custName','Customer'],['date','Date',function(r){var late=r.date<todayISO()&&r.status==='Pending';return late?pill(fmtD(r.date),'p-r'):fmtD(r.date);}],
   ['person','Responsible'],['type','Type'],['status','Status',function(r){return pill(r.status,stCls(r.status));}]],
 customer:[['id','ID'],['name','Name'],['company','Company'],['mobile','Mobile'],['wa','WhatsApp'],['email','E-mail'],['address','Address',function(r){return esc((r.address||'').slice(0,60));}]]
};

/* ============================== boot / nav ============================== */
function refreshEntity(n){return call('dashList',n).then(function(rows){S.data[n]=rows;});}
function showFatal(e){
  var m=(e&&e.message)||String(e);
  call('appWho').then(function(u){$('main').innerHTML='<div class="msg" style="color:#C0392B"><b>'+esc(m)+'</b>'+(u?'<br><br>Signed in as '+esc(u):'')+'</div>';}).catch(function(){$('main').innerHTML='<div class="msg" style="color:#C0392B">'+esc(m)+'</div>';});
}
function boot(){
  call('appBranding').then(applyBrand).catch(function(){});
  return call('appBootstrap').then(function(b){
    S.boot=b;applyBrand(b.brand);
    if(b.needsSetup)return renderSetup();
    return Promise.all(['meeting','minutes','action','followup','customer'].map(refreshEntity)).then(function(){buildNav();go(S.view);});
  }).catch(showFatal);
}
function renderSetup(){
  $('main').innerHTML='<div class="card" style="max-width:560px;margin:40px auto"><h3>First-time setup</h3><p>The sheets that store your data do not exist yet. This creates the meeting register, minutes, action items, follow-ups, customers, logs and settings. Nothing is deleted.</p><button class="btn acc" id="sbtn" onclick="runSetup()">Create system</button> <span class="errbox" id="serr"></span></div>';
}
function runSetup(){var b=$('sbtn');b.disabled=true;b.textContent='Creating… (up to a minute)';
  call('appRunSetup').then(function(){S.view='settings';return boot();}).then(function(){toast('System created. Fill in your details below.');}).catch(function(e){b.disabled=false;b.textContent='Create system';$('serr').textContent=e.message||String(e);});}
function go(v,flt){
  gStop();
  closeMenu();
  S.view=v;S.q='';S.flt=flt||'';
  [].forEach.call(document.querySelectorAll('.nav'),function(n){n.className='nav'+(n.getAttribute('data-v')===v?' on':'');});
  if(v==='overview')return renderOverview();
  if(v==='sync')return renderSync();
  if(v==='settings')return renderSettings();
  if(v==='guide')return renderGuide();
  if(v==='reports')return renderReports();
  renderList(v);
}
setInterval(function(){
  if(document.hidden||!S.boot||S.boot.needsSetup||$('modalHost').innerHTML||S.menu)return;
  if(S.view==='overview')renderOverview(true);
  else if(S.data[S.view]&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))Promise.all([refreshEntity(S.view)].concat(S.view==='meeting'?[refreshEntity('followup')]:[])).then(function(){if(!$('modalHost').innerHTML)renderList(S.view);});
},60000);

/* ============================== overview ================================ */
function renderOverview(silent){
  var m=$('main');if(!silent)m.innerHTML='<div class="msg">Loading…</div>';
  call('getDashboardData').then(function(d){
    if(S.view!=='overview')return;
    var k=d.kpi,h='';
    h+='<div class="top"><div><h1>'+esc(d.greeting)+(d.owner?', '+esc(d.owner):'')+'</h1><p>Here is what is happening with your meetings today. '+esc(d.todayText)+'</p></div>'+
       '<div><button class="btn ghost" onclick="CACHE={};go(\'overview\')">Refresh</button> <button class="btn acc" onclick="openForm(\'meeting\')">New meeting</button></div></div>';
    function kpi(l,v,s,c,onc){return '<div class="card kpi" onclick="'+onc+'"><div class="l">'+l+'</div><div class="v" style="color:'+c+'">'+v+'</div><div class="s" style="color:'+c+'">'+s+'</div></div>';}
    h+='<div class="grid kpis">'+
      kpi("Today's meetings",k.today,'scheduled today','#1F5FBF',"go('meeting','__today')")+
      kpi('Upcoming',k.upcoming,'after today','#1F5FBF',"go('meeting','__upcoming')")+
      kpi('Pending actions',k.pendingActions,'on track','#B9770E',"go('action','__open')")+
      kpi('Overdue actions',k.overdueActions,'need attention','#C0392B',"go('action','Overdue')")+
      kpi('Follow-ups due',k.followDue,'today or earlier','#B9770E',"go('followup','Pending')")+
      kpi('Locations pending',k.locPending,'awaiting customer','#B9770E',"go('meeting','__loc')")+
      kpi('Minutes pending',k.minutesPending,'not finalized','#B9770E',"go('minutes')")+
      kpi('Total meetings',k.total,'all time','#1E8449',"go('meeting')")+'</div>';
    var max=Math.max.apply(null,d.weeks.map(function(w){return w.count;}).concat([1]));
    var bars=d.weeks.map(function(w){return '<div class="bar"><b>'+w.count+'</b><i style="height:'+Math.round(w.count/max*130)+'px"></i><span>'+esc(w.label)+'</span></div>';}).join('');
    var total=d.statuses.reduce(function(a,b){return a+b.count;},0),acc=0,stops=[],leg='';
    d.statuses.forEach(function(s){var c=COLORS[s.name]||'#8b95a7',a=acc/total*100,b=(acc+s.count)/total*100;stops.push(c+' '+a+'% '+b+'%');acc+=s.count;leg+='<div><i style="background:'+c+'"></i>'+esc(s.name)+' <b>'+s.count+'</b></div>';});
    var donut=total?'<div class="donut" style="background:conic-gradient('+stops.join(',')+')"><em>'+total+'</em></div>':'<div class="empty">No meetings yet</div>';
    h+='<div class="grid c2"><div class="card"><h3>Meeting activity, last 8 weeks</h3><div class="bars">'+bars+'</div></div>'+
       '<div class="card"><h3>Meeting status</h3><div class="donutwrap">'+donut+'<div class="leg">'+leg+'</div></div></div></div>';
    var sch=d.schedule.length?'<table><tr><th>Time</th><th>Meeting</th><th>Customer</th><th>Status</th></tr>'+d.schedule.map(function(x){return '<tr class="click" onclick="editRec(\'meeting\',\''+x.id+'\')"><td><b>'+esc(x.time)+'</b></td><td>'+esc(x.title)+'</td><td>'+esc(x.customer)+'</td><td>'+pill(x.status||'Scheduled',stCls(x.status))+'</td></tr>';}).join('')+'</table>':'<div class="empty">No meetings today. Use “New meeting” to schedule one.</div>';
    var qa='<div class="qa"><button onclick="openForm(\'meeting\')">New meeting</button><button onclick="openForm(\'minutes\')">Add minutes</button>'+
      '<button onclick="openForm(\'action\')">Add action item</button><button onclick="openForm(\'followup\')">Add follow-up</button>'+
      '<button onclick="openForm(\'customer\')">Add customer</button><button onclick="go(\'meeting\',\'__loc\')">Request location</button></div>';
    h+='<div class="grid c3"><div class="card"><h3>Today\'s schedule</h3>'+sch+'</div><div class="card"><h3>Quick actions</h3>'+qa+'</div>'+
       '<div class="card"><h3>Customer coordination</h3>'+(d.locations.length?d.locations.map(function(l){return '<div class="row" onclick="editRec(\'meeting\',\''+l.id+'\')"><b>'+esc(l.customer)+'</b> '+pill(l.status,'p-a')+'<small>'+esc(l.title)+' · '+esc(l.date)+'</small></div>';}).join(''):'<div class="empty">All locations confirmed.</div>')+'</div></div>';
    h+='<div class="card"><h3>Pending action items</h3>'+(d.actions.length?'<table><tr><th>Task</th><th>Assigned to</th><th>Priority</th><th>Deadline</th><th></th></tr>'+
      d.actions.map(function(a){return '<tr><td class="click" onclick="editRec(\'action\',\''+a.id+'\')">'+esc(a.task)+'</td><td>'+esc(a.who)+'</td><td>'+pill(a.priority||'—',priCls(a.priority))+'</td><td>'+(a.late?pill(a.deadline+' · overdue','p-r'):esc(a.deadline||'—'))+'</td><td><button class="btn sm ok" onclick="markDone(\'action\',\''+a.id+'\')">Done</button></td></tr>';}).join('')+'</table>':'<div class="empty">No open action items.</div>')+'</div>';
    m.innerHTML=h;
  }).catch(function(e){if(!silent)m.innerHTML='<div class="msg" style="color:#C0392B">'+esc(e.message||e)+'</div>';});
}

/* ============================== list views ============================== */
function renderList(n){
  var cols=COLS[n],rows=S.data[n].slice().reverse(),q=S.q.toLowerCase(),f=S.flt,t=todayISO();
  rows=rows.filter(function(r){
    if(q&&Object.keys(r).map(function(k){return r[k];}).join(' ').toLowerCase().indexOf(q)<0)return false;
    if(!f)return true;
    if(f==='__loc')return (r.locStatus==='Pending'||r.locStatus==='Request Sent')&&r.status!=='Cancelled'&&r.status!=='Deleted Externally';
    if(f==='__today')return r.date===t&&r.status!=='Cancelled';
    if(f==='__upcoming')return r.date>t&&(r.status==='Scheduled'||r.status==='Rescheduled');
    if(f==='__open')return r.status!=='Completed';
    var sk=STATUSKEY[n];return sk?r[sk]===f:true;
  });
  if(n==='meeting')rows=applyColFilters(rows);
  if(n==='meeting'&&S.sort){
    var sk2=S.sort.key,sd=S.sort.dir;
    rows.sort(function(a,b){
      var x=a[sk2]||'',y=b[sk2]||'';
      if(sk2==='start'){if(!x&&!y)return 0;if(!x)return 1;if(!y)return -1;}
      return (sk2==='id'?x.localeCompare(y,undefined,{numeric:true}):(x<y?-1:x>y?1:0))*sd;
    });
  }
    if(n==='meeting')S.shown=rows;
  var opts='<option value="">All</option>';
  if(n==='meeting')opts+='<option value="__today">Today</option><option value="__upcoming">Upcoming</option><option value="__loc">Location pending</option>';

function rowButtons(n,r){

function delRec(n,id,btn){
  if(!confirm('Delete '+id+(n==='meeting'?' and its follow-ups':'')+'? This cannot be undone.'))return;
  var tr=btn&&btn.closest('tr');

  if(btn)btn.textContent='Deleting…';
  var t=$('toast');t.textContent='Deleting '+id+'… please wait';t.className='';
  t.style.display='block';clearTimeout(t._h);

    .then(function(){

function wireMeeting(){
  var el=function(k){return $('f_'+k);};
  el('custName').onchange=function(){
    var c=S.data.customer.filter(function(x){return x.name.toLowerCase()===el('custName').value.trim().toLowerCase();})[0];if(!c)return;
    [['company','company'],['custMobile','mobile'],['custWa','wa'],['address','address'],['mapLink','mapLink']].forEach(function(p){if(!el(p[0]).value)el(p[0]).value=c[p[1]]||'';});
  };
  el('start').onchange=function(){if(el('start').value)el('end').value=addMin(el('start').value,S.boot.cfg.dur);};
  el('mode').onchange=function(){if(el('mode').value==='Virtual')el('locType').value='Google Meet';else if(el('locType').value==='Google Meet')el('locType').value=S.boot.cfg.defLoc==='Google Meet'?"Customer's Office":S.boot.cfg.defLoc;};
  el('locType').onchange=function(){if(el('locType').value==='ATTAHAR Office'){var s=S.boot.settings;if(!el('address').value)el('address').value=s.officeAddr;if(!el('mapLink').value)el('mapLink').value=s.officeMap;}};
}
function saveForm(n,id){
  var data={},err=$('ferr'),btn=$('fsave');err.textContent='';
  FORMS[n].forEach(function(f){var e=$('f_'+f.k);if(e)data[f.k]=e.value;});
  var missing=FORMS[n].filter(function(f){
  if(!f.req)return false;
  if(id&&n==='meeting'&&(f.k==='custName'||f.k==='custMobile'))return false;
  return !String(data[f.k]||'').trim();
}).map(function(f){return f.l;});
  if(missing.length){err.textContent='Required: '+missing.join(', ');return;}
  if(id)data.id=id;
  var sc=$('f_saveCustomer');if(sc)data.saveCustomer=sc.checked;
    if(n==='meeting'){
    var fd=$('f_fuDate'),fsub=$('f_fuSubject'),ft=$('f_fuType'),fst=$('f_fuStatus'),fid=$('f_fuId');
    if(fd&&fd.value){data.fuDate=fd.value;data.fuSubject=fsub.value;data.fuType=ft.value;data.fuStatus=fst.value;data.fuId=fid.value;}
    else if(fid&&fid.value){err.textContent='Follow-up date is required. To drop this follow-up, set its status to Cancelled.';return;}
    else if(fsub&&fsub.value.trim()){err.textContent='Enter the follow-up date, or clear the follow-up note.';return;}
  }
  btn.disabled=true;btn.textContent='Saving…';
  call('dashSave',n,data).then(function(r){
        var arr=S.data[n],i=arr.findIndex(function(x){return x.id===r.id;});
    if(i>=0)arr[i]=r.record;else arr.push(r.record);
    var jobs=[];
    if(n==='meeting'&&data.saveCustomer)jobs.push(refreshEntity('customer').catch(function(){}));
    if(data.fuDate)jobs.push(refreshEntity('followup').catch(function(){}));
    return Promise.all(jobs).then(function(){
      closeModal();toast(r.followupError?r.followupError:'Saved '+r.id,!!r.followupError);
      if(S.view==='overview')go('overview');else if(S.view===n)renderList(n);else go(n);
    });
  })
  
  .catch(function(e){btn.disabled=false;btn.textContent='Save';err.textContent=e.message||String(e);});
}

    function card(l,v,col){return '<div class="card kpi" style="cursor:default"><div class="l">'+l+'</div><div class="v" style="color:'+col+'">'+v+'</div></div>';}
    var h='<div class="top"><div><h1>Calendar Sync</h1><p>Calendar: <b>'+esc(d.calendar)+'</b> · Automation: '+(d.auto?pill('ON · every '+d.every+' min','p-g'):pill('OFF','p-r'))+'</p></div><div>'+
      '<button class="btn" id="syncbtn" onclick="runSync()">Sync now</button> '+
      '<button class="btn amber" onclick="openReset()">Reset &amp; Re-Sync Calendar</button> '+
      (d.auto?'<button class="btn ghost" onclick="toggleAuto(false)">Turn off automation</button>':'<button class="btn ok" onclick="toggleAuto(true)">Turn on automation</button>')+'</div></div>';
    h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">'+card('Synced',c.synced,'#1E8449')+card('Waiting',c.pending,'#B9770E')+card('Conflicts',c.conflict,'#C0392B')+card('Errors',c.error,'#C0392B')+card('Deleted in calendar',c.deleted,'#C0392B')+'</div>';
    if(d.conflicts.length){
      h+='<div class="card" style="margin-bottom:14px"><h3>Conflicts: changed in both places</h3><table><tr><th>Meeting</th><th>Date</th><th>Choose the version to keep</th></tr>'+
        d.conflicts.map(function(x){return '<tr><td>'+esc(x.title)+'</td><td>'+esc(x.date)+'</td><td><button class="btn sm" onclick="resolveC(\''+x.id+'\',\'sheet\')">Keep web app version</button> <button class="btn sm ghost" onclick="resolveC(\''+x.id+'\',\'calendar\')">Use calendar version</button></td></tr>';}).join('')+'</table></div>';
    }
    h+='<div class="card"><h3>Recent sync activity</h3>'+(d.log.length?'<div style="overflow:auto"><table><tr><th>Time</th><th>Meeting</th><th>Direction</th><th>Operation</th><th>Status</th><th>Details</th></tr>'+
      d.log.map(function(x){return '<tr><td>'+esc(x.ts)+'</td><td>'+esc(x.meetingId)+'</td><td>'+esc(x.dir)+'</td><td>'+esc(x.op)+'</td><td>'+pill(x.status,x.status==='Success'?'p-g':x.status==='Skipped'?'p-a':'p-r')+'</td><td>'+esc(x.error)+'</td></tr>';}).join('')+'</table></div>':'<div class="empty">No sync activity yet. Click “Sync now”.</div>')+'</div>';
    m.innerHTML=h;
  }).catch(function(e){m.innerHTML='<div class="msg" style="color:#C0392B">'+esc(e.message||e)+'</div>';});

/* ============ Reset & Re-Sync Calendar ============ */
var RS=null;
function openReset(){
  toast('Checking the calendar…');
  call('dashResetPreview').then(function(p){
    var restore=p.deletedExternally?'<div class="fld full" style="margin-top:8px"><label style="font-weight:400"><input type="checkbox" id="rs_restore"> Also restore '+p.deletedExternally+' meeting(s) marked “Deleted Externally” back to “Scheduled” and sync them</label></div>':'';
    $('modalHost').innerHTML='<div class="ov"><div class="modal" style="width:min(520px,94vw)" role="dialog"><header><span>Reset &amp; Re-Sync Calendar</span><button class="x" onclick="closeModal()" aria-label="Close">×</button></header><div class="body">'+
      '<p style="margin-top:0">Target calendar: <b>'+esc(p.calendarName)+'</b><br><small style="color:var(--mut)">'+esc(p.calendarId)+'</small></p>'+
      '<p>'+p.eligible+' of '+p.total+' meeting(s) will be checked. Missing events are created in this calendar and existing ones are updated from the Meeting Register. Events in your other calendars are <b>not</b> changed or deleted. Cancelled meetings ('+p.cancelled+') get no event.</p>'+
      '<p style="color:var(--mut)">Safe to repeat. Keep this window open until it finishes.</p>'+restore+
      '</div><footer><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn acc" onclick="startReset()">Start Reset &amp; Re-Sync</button></footer></div></div>';
  }).catch(function(e){toast(e.message||e,1);});
}
function resetProgress(txt,pct){var t=$('rs_txt'),b=$('rs_bar');if(t)t.textContent=txt;if(b)b.style.width=pct+'%';}
function startReset(){
  var cb=$('rs_restore');
  RS={cal:'',restore:!!(cb&&cb.checked),total:0,rep:{checked:0,created:0,recovered:0,unchanged:0,updated:0,removed:0,skipped:[],failed:[]}};
  $('modalHost').innerHTML='<div class="ov"><div class="modal" style="width:min(520px,94vw)"><header><span>Re-syncing…</span></header><div class="body"><div id="rs_txt">Preparing…</div><div style="background:#eceff5;border-radius:99px;height:10px;margin-top:10px;overflow:hidden"><div id="rs_bar" style="height:10px;width:0;background:var(--acc);transition:width .3s"></div></div><p style="color:var(--mut);font-size:12px">Do not close this window.</p></div></div></div>';
  call('dashResetBegin').then(function(b){RS.cal=b.calId;RS.total=b.total;return resetStep(0);}).catch(function(e){return resetFinish(e.message||String(e));});
}
function resetStep(cur){
  return call('dashResetBatch',RS.cal,cur,RS.restore).then(function(r){
    var p=RS.rep;['checked','created','recovered','unchanged','updated','removed'].forEach(function(k){p[k]+=r[k]||0;});
    p.skipped=p.skipped.concat(r.skipped||[]);p.failed=p.failed.concat(r.failed||[]);
    var pct=RS.total?Math.min(100,Math.round(r.next/RS.total*100)):100;
    resetProgress('Checked '+p.checked+' meeting(s)… '+pct+'%',pct);
    if(r.stopped)return resetFinish(r.stopped);
    return r.done?resetFinish(''):resetStep(r.next);
  }).catch(function(e){return resetFinish(e.message||String(e));});
}
function resetFinish(err){
  var p=RS.rep;
  call('dashResetEnd',err?('Stopped: '+err):('Checked '+p.checked+', created '+p.created+', updated '+p.updated)).catch(function(){});
  return refreshEntity('meeting').catch(function(){}).then(function(){
    function row(l,v){return '<tr><td>'+l+'</td><td><b>'+v+'</b></td></tr>';}
    var h='<div class="ov"><div class="modal" role="dialog"><header><span>Synchronization report</span><button class="x" onclick="closeModal()" aria-label="Close">×</button></header><div class="body">'+
      (err?'<div class="errbox" style="margin:0 0 10px">'+esc(err)+'<br>The run stopped early. Nothing was deleted. Fix the cause and run it again; finished meetings are not duplicated.</div>':'<p style="margin-top:0;color:var(--green);font-weight:600">Completed.</p>')+
      '<table>'+row('Total meetings checked',p.checked)+row('Newly created events',p.created)+row('Existing events already synced',p.unchanged)+row('Existing events re-linked (found in calendar, not in registry)',p.recovered)+row('Events updated',p.updated)+row('Cancelled-meeting events removed',p.removed)+row('Meetings skipped',p.skipped.length)+row('Failed events',p.failed.length)+'</table>';
    if(p.skipped.length)h+='<h3 style="margin-top:14px">Skipped</h3><table><tr><th>Meeting</th><th>Reason</th></tr>'+p.skipped.map(function(x){return '<tr><td>'+esc(x.id)+'<br><small>'+esc(x.title)+'</small></td><td>'+esc(x.reason)+'</td></tr>';}).join('')+'</table>';
    if(p.failed.length)h+='<h3 style="margin-top:14px;color:var(--red)">Failed</h3><table><tr><th>Meeting</th><th>Error</th></tr>'+p.failed.map(function(x){return '<tr><td>'+esc(x.id)+'<br><small>'+esc(x.title)+'</small></td><td>'+esc(x.error)+'</td></tr>';}).join('')+'</table>';
    h+='</div><footer><button class="btn" onclick="closeModal()">Close</button></footer></div></div>';
    $('modalHost').innerHTML=h;
    if(S.view==='sync')renderSync();
  });
}
/* ============================== reports ================================= */

/* logo */
function shrink(img){
  var sizes=[360,300,240,200,160];
  for(var i=0;i<sizes.length;i++){
    var sc=Math.min(1,sizes[i]/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    var j=c.toDataURL('image/jpeg',0.85);if(j.length<=44000)return j;
  }
  return null;
}
function pickLogo(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){var img=new Image();img.onload=function(){
    var out=shrink(img);if(!out){toast('That image is too detailed. Try a simpler logo.',1);return;}
    call('appSaveLogo',out).then(function(l){S.boot.brand.logo=l;applyBrand(S.boot.brand);$('logoPrev').src=l;toast('Logo updated');}).catch(function(e){toast(e.message||e,1);});
  };img.onerror=function(){toast('Could not read that image.',1);};img.src=r.result;};
  r.readAsDataURL(f);
}
function resetLogo(){call('appSaveLogo','').then(function(l){S.boot.brand.logo=l;applyBrand(S.boot.brand);$('logoPrev').src=l;toast('Default logo restored');}).catch(function(e){toast(e.message||e,1);});}

/* ============ COLUMN FILTERS (Meeting Register) ============ */
S.cf={};S.sort=null;S.menu=null;
var FCOLS=['id','date','start','title','custName','priority','status','done','fu','locStatus','syncStatus'];
var FTITLE={id:'ID',date:'Date',start:'Time',title:'Agenda',custName:'Customer',priority:'Type of Customer',status:'Status',done:'Completed',fu:'Follow-Up',locStatus:'Location',syncStatus:'Sync'};

function dup(x){return [x,x];}
function isoAdd(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function isoMonth(iso,off){var p=iso.split('-');return new Date(Date.UTC(+p[0],+p[1]-1+off,1)).toISOString().slice(0,10);}
function dateRange(k,t){
  if(k==='today')return [t,t];
  if(k==='tomorrow'){var a=isoAdd(t,1);return [a,a];}
  if(k==='yesterday'){var b=isoAdd(t,-1);return [b,b];}
  if(k==='week'){var dow=(new Date(t+'T00:00:00Z').getUTCDay()+6)%7,s=isoAdd(t,-dow);return [s,isoAdd(s,6)];}   // Monday to Sunday
  if(k==='month')return [isoMonth(t,0),isoAdd(isoMonth(t,1),-1)];
  if(k==='lastmonth')return [isoMonth(t,-1),isoAdd(isoMonth(t,0),-1)];
  return ['',''];
}

function colActive(k){
  var f=S.cf[k];if(!f)return false;
  return Object.keys(f).some(function(x){var v=f[x];return Array.isArray(v)?v.length>0:!!v;});
}
function activeCount(){return FCOLS.filter(colActive).length;}
function clearColFilters(){S.cf={};S.sort=null;closeMenu();renderList('meeting');}

function fhHead(c){
  var k=c[0],act=colActive(k),srt=S.sort&&S.sort.key===k;
  var ind=act?'●':(srt?(S.sort.dir>0?'↑':'↓'):'▾');
  return '<th class="fh'+(act||srt?' fa':'')+'" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" data-col="'+k+'" title="Filter / sort '+esc(c[1])+'">'+c[1]+'<span class="fi">'+ind+'</span></th>';
}

/* ---- matching ---- */
function valOf(k,r){
  if(k==='priority')return r.priority||'Unassigned';
  if(k==='status')return r.status||'Scheduled';
  if(k==='locStatus')return r.locStatus||'__blank';
  if(k==='syncStatus')return r.syncStatus||'Not Synced';
  return '';
}
function applyColFilters(rows){
  var keys=FCOLS.filter(colActive);if(!keys.length)return rows;
  var ctx={today:todayISO(),fu:{}};
  S.data.followup.forEach(function(x){(ctx.fu[x.meetingId]=ctx.fu[x.meetingId]||[]).push(x);});
  return rows.filter(function(r){return keys.every(function(k){return matchCol(k,r,S.cf[k],ctx);});});
}
function matchCol(k,r,f,ctx){
  var t=ctx.today,sel=f.sel||[];
  if(k==='id'){
    var id=String(r.id||'');
    if(f.q&&id.toLowerCase().indexOf(f.q.toLowerCase())<0)return false;
    return !sel.length||sel.indexOf(id)>=0;
  }
  if(k==='date'){
    var d=r.date;if(!d)return false;
    if(f.from&&d<f.from)return false;
    if(f.to&&d>f.to)return false;
    if(f.when==='upcoming'&&d<t)return false;     // today and later
    if(f.when==='past'&&d>=t)return false;        // before today
    return true;
  }
  if(k==='start'){
    var s=r.start;if(!s)return false;
    if(f.from&&s<f.from)return false;
    if(f.to&&s>f.to)return false;
    return true;
  }
  if(k==='title'){
    var terms=String(f.q||'').split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean);
    if(!terms.length)return true;
    var hay=String(r.title||'').toLowerCase();
    return terms.some(function(x){return hay.indexOf(x)>=0;});
  }
  if(k==='custName'){
    var a=String(r.custName||'').trim().toLowerCase(),b=String(r.company||'').trim().toLowerCase();
    if(!sel.length&&!f.blank)return true;
    if(!a&&!b)return !!f.blank;
    return sel.indexOf(a)>=0||sel.indexOf(b)>=0;
  }
  if(k==='done'){
    if(f.v==='done')return r.status==='Completed';
    if(f.v==='notdone')return r.status!=='Completed';
    return true;
  }
  if(k==='fu'){
    var list=ctx.fu[r.id]||[],open=list.filter(isOpenFu);
    if(sel.length){
      var ok=sel.some(function(o){
        if(o==='required')return open.length>0;
        if(o==='overdue')return open.some(function(x){return x.date&&x.date<t;});
        if(o==='today')return open.some(function(x){return x.date===t;});
        if(o==='upcoming')return open.some(function(x){return x.date&&x.date>t;});
        if(o==='none')return list.filter(function(x){return x.status!=='Cancelled';}).length===0;
        return false;
      });
      if(!ok)return false;
    }
    if(f.from||f.to){
      if(!open.some(function(x){return x.date&&(!f.from||x.date>=f.from)&&(!f.to||x.date<=f.to);}))return false;
    }
    return true;
  }
  return sel.indexOf(valOf(k,r))>=0;   // priority, status, location, sync
}

/* ---- option lists ---- */
function custOpts(){
  var seen={},out=[];
  function add(x){x=String(x||'').trim();if(!x)return;var key=x.toLowerCase();if(!seen[key]){seen[key]=1;out.push([key,x]);}}
  S.data.meeting.forEach(function(m){add(m.custName);add(m.company);});
  S.data.customer.forEach(function(c){add(c.name);add(c.company);});
  return out.sort(function(a,b){return a[1].localeCompare(b[1]);});
}
function fmOpts(k){
  var L=S.boot.lists;
  if(k==='id')return S.data.meeting.map(function(m){return String(m.id);}).sort(function(a,b){return a.localeCompare(b,undefined,{numeric:true});}).map(dup);
  if(k==='custName')return custOpts();
  if(k==='priority')return (L.priority||[]).map(dup).concat([['Unassigned','Unassigned']]);
  if(k==='status')return (L.meetingStatus||[]).map(dup);
  if(k==='locStatus')return (L.locationStatus||[]).map(dup).concat([['__blank','No response (blank)']]);
  if(k==='syncStatus')return (L.syncStatus||[]).map(dup);
  return [];
}

/* ---- menu open / close / position ---- */
function placeMenu(th,m){
  var r=th.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  var left=Math.max(8,Math.min(r.left,window.innerWidth-w-8));
  var top=r.bottom+4;if(top+h>window.innerHeight-8)top=Math.max(8,window.innerHeight-h-8);

function openMenu(th){
  var k=th.getAttribute('data-col');
  if(S.menu===k){closeMenu();return;}
  closeMenu();S.menu=k;
  var m=document.createElement('div');
  m.id='fmenu';m.className='fmenu';m.setAttribute('role','dialog');m.setAttribute('aria-label','Filter '+FTITLE[k]);
  m.innerHTML=menuHtml(k);
  document.body.appendChild(m);
  th.setAttribute('aria-expanded','true');
  var s=m.querySelector('#fm_q,#fm_cs');if(s&&s.value&&s.id==='fm_q'&&k==='id')fmSearch(s);
  placeMenu(th,m);
  var first=m.querySelector('input:not([type=checkbox]):not([type=radio]),input,button');if(first&&!matchMedia('(pointer:coarse)').matches)first.focus();
}
function closeMenu(){
  var m=$('fmenu');if(m)m.remove();
  S.menu=null;
  var a=document.querySelector('th.fh[aria-expanded="true"]');if(a)a.setAttribute('aria-expanded','false');
}

/* ---- menu actions ---- */
function fmSearch(inp){
  var q=inp.value.toLowerCase();
  [].forEach.call($('fmenu').querySelectorAll('#fm_list .fo'),function(l){l.style.display=l.textContent.toLowerCase().indexOf(q)<0?'none':'';});
}
function fmAll(){
  [].forEach.call($('fmenu').querySelectorAll('#fm_list .fo'),function(l){if(l.style.display!=='none')l.querySelector('input').checked=true;});
}
function fmDatePreset(p){var r=dateRange(p,todayISO());$('fm_from').value=r[0];$('fm_to').value=r[1];}
function fmTimePreset(a,b){$('fm_from').value=a;$('fm_to').value=b;}
function fmClear(){var k=S.menu;delete S.cf[k];closeMenu();renderList('meeting');}
function setSort(key,dir){S.sort=key?{key:key,dir:dir}:null;closeMenu();renderList('meeting');}
function applyMenu(){
  var k=S.menu,m=$('fmenu');if(!k||!m)return;
  function v(id){var e=m.querySelector('#fm_'+id);return e?e.value.trim():'';}
  function checked(name){return [].map.call(m.querySelectorAll('input[name='+name+']:checked'),function(e){return e.value;});}
  var f={};
  if(k==='id'){f.q=v('q');f.sel=checked('fm_sel');}
  else if(k==='date'){f.from=v('from');f.to=v('to');f.when=checked('fm_when')[0]||'';}
  else if(k==='start'){f.from=v('from');f.to=v('to');}
  else if(k==='title'){f.q=v('q');}
  else if(k==='custName'){f.sel=checked('fm_sel');f.blank=m.querySelector('#fm_blank').checked;}
  else if(k==='done'){f.v=checked('fm_done')[0]||'';}
  else if(k==='fu'){f.sel=checked('fm_sel');f.from=v('from');f.to=v('to');}
  else{f.sel=checked('fm_sel');}
  if(f.from&&f.to&&f.from>f.to){$('fm_err').textContent='“From” must not be after “To”.';return;}
  var clean={};
  Object.keys(f).forEach(function(x){var val=f[x];if(Array.isArray(val)?val.length:val)clean[x]=val;});
  if(Object.keys(clean).length)S.cf[k]=clean;else delete S.cf[k];
  closeMenu();renderList('meeting');
}

/* ============================ FINDING THINGS ON THE REAL PAGE ============================ */
var TG_CAND='button,a,th,h1,h2,h3,label,summary,.tab,.kpi,.nav';

function tgNorm(s){return String(s==null?'':s).replace(/\s+/g,' ').trim();}
function tgClean(s){return tgNorm(s).replace(/[▾▴↑↓●×*]/g,'').trim().toLowerCase().slice(0,60);}
function tgVis(el){return !!(el&&el.getClientRects&&el.getClientRects().length&&!(el.closest&&el.closest('#tgdock')));}
function tgQS(css){
  try{var l=document.querySelectorAll(css);for(var i=0;i<l.length;i++)if(tgVis(l[i]))return l[i];}catch(e){}
  return null;
}
function tgExpand(el){
  if(!el)return null;
  var t=el.tagName;
  if(t==='LABEL'||t==='INPUT'||t==='SELECT'||t==='TEXTAREA'){var f=el.closest('.fld');if(f)return f;}
  if(t==='H3'){var c=el.closest('.card');if(c)return c;}
  return el;
}
function tgFind(spec){
  if(!spec)return null;
  if(typeof spec==='function'){try{return spec();}catch(e){return null;}}
  if(Array.isArray(spec)){for(var i=0;i<spec.length;i++){var r=tgFind(spec[i]);if(r)return r;}return null;}
  if(typeof spec==='string'){var q=tgQS(spec);return q?tgExpand(q):null;}
  if(spec.t){
    var scope=document.querySelector(spec.in||'#main');if(!scope)return null;
    var want=tgNorm(spec.t).toLowerCase(),list=scope.querySelectorAll(TG_CAND),a=null,b=null;
    for(var j=0;j<list.length;j++){
      var el=list[j];if(!tgVis(el))continue;
      var tx=tgNorm(el.textContent).toLowerCase();
      if(spec.x){if(tx===want){a=el;break;}continue;}
      if(tx.indexOf(want)===0){a=el;break;}
      if(!b&&tx.indexOf(want)>=0)b=el;
    }
    return tgExpand(a||b);
  }
  return null;
}

/* ---- what has already been explained on this tab (so automatic steps do not repeat it) ---- */
function tgMark(el){
  if(!el)return;
  function add(s){s=tgClean(s);if(s.length>=3)GT.cov.push(s);}
  add(String(el.textContent||'').slice(0,80));
  var h=el.querySelector&&el.querySelector('h3,label,.l');
  if(h)add(h.textContent);
}
function tgCovered(txt){
  var c=tgClean(txt);if(c.length<3)return true;
  return GT.cov.some(function(s){return s===c||(s.length>=5&&c.indexOf(s)===0)||(c.length>=5&&s.indexOf(c)===0);});
}

/* ============================ AUTOMATIC STEPS ============================ */
function tgByHelp(h){
  var l=document.querySelectorAll('[data-help]');
  for(var i=0;i<l.length;i++)if(tgNorm(l[i].getAttribute('data-help'))===h&&tgVis(l[i]))return l[i];
  return null;
}
function tgCardBy(name){
  var l=document.querySelectorAll('#main .card');
  for(var i=0;i<l.length;i++){
    var h=[].filter.call(l[i].children,function(c){return c.tagName==='H3';})[0];
    if(h&&tgNorm(h.textContent)===name&&tgVis(l[i]))return l[i];
  }
  return null;
}
function tgThBy(txt){
  var l=document.querySelectorAll('#main table th');
  for(var i=0;i<l.length;i++)if(tgClean(l[i].textContent)===tgClean(txt)&&tgVis(l[i]))return l[i];
  return null;
}

function tgAutoKpis(){
  var out=[];
  [].forEach.call(document.querySelectorAll('#main .kpi'),function(k,i){
    if(!tgVis(k))return;
    var l=k.querySelector('.l'),v=k.querySelector('.v');
    var label=l?tgNorm(l.textContent):'Card',val=v?tgNorm(v.textContent):'';
    var help=GUIDE_KPI[label.toLowerCase()]||'';
    var click=k.getAttribute('onclick')?' Is card par click karo to related list khul jati hai.':'';
    out.push({find:function(){
      var all=[].filter.call(document.querySelectorAll('#main .kpi'),tgVis);return all[i]||null;},
      text:label+'. Abhi '+val+' hai. '+help+click});
  });
  return out;
}

function tgAutoSettings(){
  var out=[];
  (typeof TABS!=='undefined'?TABS:[]).forEach(function(t){
    var id=t[0],label=t[1];
    out.push({pre:'tab:'+id,find:'#p_'+id,noscroll:false,text:function(el){
      var s='Tab '+label+'. '+(GUIDE_SETTINGS[id]||'');
      if(!el)return s;
      var heads=[].map.call(el.querySelectorAll('.card h3'),function(h){return tgNorm(h.textContent);}).filter(Boolean);
      var labs=[].map.call(el.querySelectorAll('.fld label'),function(l){return tgNorm(l.textContent).replace(/\*/g,'').trim();}).filter(Boolean);
      if(heads.length)s+=' Isme ye lists hain: '+heads.join(', ')+'.';
      else if(labs.length)s+=' Isme ye fields hain: '+labs.join(', ')+'.';
      return s;}});
  });
  return out;
}

function tgAutoForm(name){
  var m=document.querySelector('#modalHost .modal');if(!m)return [];
  var labs=[];
  [].forEach.call(m.querySelectorAll('.fld > label'),function(l){
    var t=tgNorm(l.textContent).replace(/\*/g,'').trim();
    if(t&&!tgCovered(t)&&labs.indexOf(t)<0)labs.push(t);
  });
  if(!labs.length)return [];
  return [{pre:'form:'+name,find:'#modalHost .modal .form',text:'Form ke baaki fields: '+labs.join(', ')+'.'}];
}

function tgAutoPage(){
  var out=[],main=$('main');if(!main)return out;
  var seen={};
  /* 1. things you labelled with data-help */
  [].forEach.call(main.querySelectorAll('[data-help]'),function(el){
    var h=tgNorm(el.getAttribute('data-help'));
    if(!h||seen[h]||!tgVis(el))return;
    seen[h]=1;
    out.push({find:function(){return tgByHelp(h);},text:h});
  });
  /* 2. cards (sections) with a heading that were not explained */
  [].forEach.call(main.querySelectorAll('.card'),function(card){
    var h3=[].filter.call(card.children,function(c){return c.tagName==='H3';})[0];
    if(!h3||!tgVis(card)||card.hasAttribute('data-help'))return;
    var name=tgNorm(h3.textContent);if(!name||tgCovered(name))return;
    GT.cov.push(tgClean(name));
    var labs=[];
    [].forEach.call(card.querySelectorAll('.btn'),function(b){
      var t=tgNorm(b.textContent);if(t&&!b.closest('tr')&&labs.indexOf(t)<0&&labs.length<6)labs.push(t);});
    out.push({find:function(){return tgCardBy(name);},
      text:'"'+name+'" section. Yahan is tab ki jaankari dikhti hai.'+(labs.length?' Is section ke buttons: '+labs.join(', ')+'.':'')});
  });
  /* 3. top-bar buttons that were not explained */
  var bl=[];
  [].forEach.call(main.querySelectorAll('.top .btn,.tools .btn,.savebar .btn'),function(b){
    var t=tgNorm(b.textContent);if(!t||!tgVis(b)||tgCovered(t)||bl.indexOf(t)>=0)return;
    GT.cov.push(tgClean(t));bl.push(t);
  });
  if(bl.length){var b0=bl[0];out.push({find:function(){return tgFind({t:b0,x:1});},text:'Is page par ye buttons bhi hain: '+bl.join(', ')+'.'});}
  /* 4. table columns that were not explained */
  var tb=main.querySelector('table'),cl=[];
  if(tb)[].forEach.call(tb.querySelectorAll('th'),function(th){
    var t=tgNorm(th.textContent).replace(/[▾▴↑↓●]/g,'').trim();
    if(!t||!tgVis(th)||tgCovered(t)||cl.indexOf(t)>=0)return;
    cl.push(t);
  });
  if(cl.length){var c0=cl[0];out.push({find:function(){return tgThBy(c0);},text:'Table ke baaki columns: '+cl.join(', ')+'.'});}
  return out;
}

function tgAuto(a){
  var p=String(a).split(':'),k=p[0],arg=p[1]||'';
  if(k==='kpis')return tgAutoKpis();
  if(k==='page')return tgAutoPage();
  if(k==='settings')return tgAutoSettings();
  if(k==='form')return tgAutoForm(arg);
  return [];
}

  return {find:o.s,text:o.t,pre:o.p||(a.indexOf('form:')===0?a:''),keep:!!o.k,noscroll:!!o.n,auto:a};
}

/* ============================ RUNNING THE TOUR ============================ */
function tgReset(st){
  var pre=(st&&st.pre)||'';
  if(pre.indexOf('form:')!==0&&(GT.form||$('modalHost').innerHTML)){try{closeModal();}catch(e){}GT.form=null;}
  if(pre.indexOf('filter:')!==0){try{closeMenu();}catch(e){}}
  if(pre!=='wa'){
    [].forEach.call(document.querySelectorAll('.wasub.open'),function(s){
      s.classList.remove('open');
      var b=s.parentNode&&s.parentNode.querySelector('.wagreen');if(b)b.textContent='WhatsApp ▾';
    });
  }
}
function tgPre(st){
  var p=st.pre||'';
  try{
    if(p.indexOf('form:')===0){
      if(GT.form!==p||!$('modalHost').innerHTML){closeModal();openForm(p.slice(5));GT.form=p;}
    }else if(p.indexOf('tab:')===0){
      showTab(p.slice(4));
    }else if(p.indexOf('filter:')===0){
      var col=p.slice(7),th=document.querySelector('th.fh[data-col="'+col+'"]');
      if(th&&tgVis(th)&&(S.menu!==col||!$('fmenu'))){closeMenu();openMenu(th);}
    }else if(p==='wa'){
      var b=document.querySelector('#main .wagreen'),sub=b&&b.parentNode.querySelector('.wasub');
      if(sub&&!sub.classList.contains('open'))toggleWa(b);
    }
  }catch(e){}
  return tgWaitFor(st);
}
function tgWaitFor(st){
  return new Promise(function(ok){
    if(st.auto||!st.find)return setTimeout(ok,60);
    var t0=Date.now(),lim=st.keep?350:1500;
    (function chk(){
      if(tgFind(st.find)||Date.now()-t0>lim)return ok();
      setTimeout(chk,100);
    })();
  });
}
function tgReady(){
  return new Promise(function(ok){
    var t0=Date.now();
    (function chk(){
      var m=$('main'),ld=m&&m.querySelector('.msg');
      var busy=!m||!m.children.length||(ld&&/Loading|Running/i.test(ld.textContent));
      if(!busy||Date.now()-t0>10000)return setTimeout(ok,250);
      setTimeout(chk,150);
    })();
  });
}
function tgTxt(st,el){
  var t=st.text;
  try{if(typeof t==='function')t=t(el);}catch(e){t='';}
  t=String(t||'');
  var lab=el?tgNorm(el.textContent).replace(/[▾▴↑↓●×]/g,'').trim().slice(0,40):'';
  return t.replace(/\{txt\}/g,lab);
}
function tgPlace(){
  var sp=$('tgspot');if(!sp)return;
  if(!GT.cur){sp.style.display='none';return;}
  var el=GT.cur.el;
  if(!el||!document.body.contains(el)||!tgVis(el))el=GT.cur.el=tgFind(GT.cur.find);
  if(!el){sp.style.display='none';return;}
  var r=el.getBoundingClientRect(),pad=6;
  sp.style.display='block';
  sp.style.left=(r.left-pad)+'px';sp.style.top=(r.top-pad)+'px';
  sp.style.width=(r.width+pad*2)+'px';sp.style.height=(r.height+pad*2)+'px';
}

function tgVoice(){
  var vs=GT.voices;if(!vs.length)return null;
  if(GT.vname){var m=vs.filter(function(v){return v.name===GT.vname;})[0];if(m)return m;}
  return vs.filter(function(v){return /^hi/i.test(v.lang);})[0]||vs.filter(function(v){return /^en[-_]IN/i.test(v.lang);})[0]||
    vs.filter(function(v){return /^en/i.test(v.lang);})[0]||vs[0];
}
function tgSpeak(text,tok,done){
  var est=Math.max(3500,text.length*58/GT.rate),fired=false,t0=Date.now(),ss=window.speechSynthesis;
  function fin(){
    if(fired||tok!==GT.tok||!GT.play||!GT.on)return;
    fired=true;clearTimeout(GT.timer);done();
  }
  function endSoon(){setTimeout(fin,Math.max(450,est*0.55-(Date.now()-t0)));}   /* never rush if the voice failed silently */
  if(GT.voice&&ss){
    setTimeout(function(){
      if(tok!==GT.tok||!GT.play)return;
      var v=tgVoice();
      var parts=(text.match(/[^.!?।]+[.!?।]*/g)||[text]).map(function(p){return p.trim();}).filter(Boolean);
      parts.forEach(function(p,i){
        var u=new SpeechSynthesisUtterance(p);
        u.lang=v?v.lang:'hi-IN';if(v)u.voice=v;u.rate=GT.rate;
        if(i===parts.length-1){u.onend=endSoon;u.onerror=endSoon;}
        ss.speak(u);
      });
    },90);
    GT.timer=setTimeout(fin,est*2.8+2500);
  }else{
    GT.timer=setTimeout(fin,est);
  }
}

function tgRun(){
  if(!GT.on||!GT.play)return;
  var st=GT.steps[GT.si];
  if(!st)return tgNextChapter();
  GT.tok++;var tok=GT.tok;clearTimeout(GT.timer);
  if(window.speechSynthesis)speechSynthesis.cancel();
  tgReset(st);
  tgPre(st).then(function(){
    if(tok!==GT.tok||!GT.on||!GT.play)return;
    if(st.auto){
      var gen=[];try{gen=tgAuto(st.auto)||[];}catch(e){gen=[];}
      GT.steps.splice.apply(GT.steps,[GT.si,1].concat(gen));
      tgDockUpdate();
      return tgRun();
    }
    var el=tgFind(st.find);
    if(!el&&!st.keep){GT.si++;return tgRun();}
    GT.cur={find:st.find,el:el};
    if(el){
      tgMark(el);
      if(!st.noscroll){try{el.scrollIntoView({block:'center',inline:'nearest'});}catch(e){}}
    }
    var txt=tgTxt(st,el);
    if(!txt){GT.si++;return tgRun();}
    $('tgsub').textContent=txt;$('tgsub').classList.remove('open');
    tgDockUpdate();tgPlace();setTimeout(tgPlace,80);
    tgSpeak(txt,tok,function(){GT.si++;tgRun();});
  }).catch(function(){if(tok===GT.tok){GT.si++;tgRun();}});
}

function tgOpenChapter(ci){
  var my=++GT.otok;
  GT.tok++;clearTimeout(GT.timer);
  if(window.speechSynthesis)speechSynthesis.cancel();
  tgReset();
  GT.ci=ci;GT.steps=[];GT.si=0;GT.cov=[];GT.cur=null;
  tgPlace();
  var ch=GT.ch[ci];
  if($('tgsub'))$('tgsub').textContent='Loading…';
  tgDockUpdate();
  var view=ch.id==='_menu'?'overview':ch.id;
  GT.nav=true;
  try{go(view);}catch(e){}
  GT.nav=false;
  tgReady().then(function(){
    if(my!==GT.otok||!GT.on)return;
    GT.steps=tgBuild(ch);GT.si=0;
    tgDockUpdate();
    if(GT.play)tgRun();
  });
}
function tgNextChapter(){
  if(GT.single||GT.ci>=GT.ch.length-1)return tgFinish();
  tgOpenChapter(GT.ci+1);
}
function tgFinish(){tgEnd(true);toast('Guide poora hua.');}

function tgStart(ci,single){
  tgEnd(false);
  GT.ch=tgChapters();GT.single=!!single;GT.on=true;GT.play=true;
  if(!window.speechSynthesis)GT.voice=false;
  tgBuildDock();tgLoadVoices();
  clearInterval(GT.place);GT.place=setInterval(tgPlace,200);
  tgOpenChapter(ci||0);
}
function tgEnd(back){
  var was=GT.on;
  GT.on=false;GT.play=false;GT.otok++;GT.tok++;GT.cur=null;
  clearTimeout(GT.timer);clearInterval(GT.place);
  if(window.speechSynthesis)speechSynthesis.cancel();
  var d=$('tgdock');if(d)d.remove();
  var s=$('tgspot');if(s)s.remove();
  if(was)tgReset();
  if(was&&back){GT.nav=true;try{go('guide');}finally{GT.nav=false;}}
}
function gStop(){                         /* called by go() on every page change */
  if(GT.nav)return;
  if(GT.on)tgEnd(false);
}

/* ============================ PLAYER CONTROLS ============================ */
function tgPause(){
  GT.play=false;GT.tok++;clearTimeout(GT.timer);
  if(window.speechSynthesis)speechSynthesis.cancel();
  tgDockUpdate();
}
function tgToggle(){
  if(GT.play)return tgPause();
  GT.play=true;tgDockUpdate();tgRun();
}
function tgSkip(d){
  if(!GT.on)return;
  var i=GT.si+d;
  if(i<0)i=0;
  if(i>=GT.steps.length)return tgNextChapter();
  GT.play=true;GT.si=i;tgRun();
}
function tgChap(d){
  if(!GT.on)return;
  var i=GT.ci+d;if(i<0||i>=GT.ch.length)return;
  GT.play=true;tgOpenChapter(i);
}
function tgJump(v){if(!GT.on)return;GT.play=true;tgOpenChapter(+v);}
function tgClose(){tgEnd(true);}
function tgVoiceOn(cb){GT.voice=cb.checked;if(GT.on&&GT.play)tgRun();}
function tgVoicePick(sel){GT.vname=sel.value;if(GT.on&&GT.play&&GT.voice)tgRun();}
function tgRate(sel){GT.rate=parseFloat(sel.value)||1;if(GT.on&&GT.play&&GT.voice)tgRun();}

function tgLoadVoices(){
  GT.voices=window.speechSynthesis?speechSynthesis.getVoices():[];
  var sel=$('tgvsel');if(!sel)return;
  sel.innerHTML='<option value="">Auto voice</option>'+GT.voices.map(function(v){
    return '<option value="'+esc(v.name)+'"'+(v.name===GT.vname?' selected':'')+'>'+esc(v.name+' ('+v.lang+')')+'</option>';}).join('');
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=tgLoadVoices;

function tgBuildDock(){
  if($('tgdock'))return;
  var d=document.createElement('div');d.id='tgdock';d.setAttribute('role','region');d.setAttribute('aria-label','Instructions guide');
  var hasV=!!window.speechSynthesis;

    '<div class="tgsub" id="tgsub" aria-live="polite"></div><div class="tgbar"><i id="tgprog"></i></div>'+
    '<div class="tgctl">'+
    '<button class="tgb" type="button" onclick="tgChap(-1)" title="Pichla tab" aria-label="Pichla tab">⏮</button>'+
    '<button class="tgb" type="button" onclick="tgSkip(-1)" title="Pichla step" aria-label="Pichla step">◀</button>'+
    '<button class="tgb pri" type="button" id="tgplay" onclick="tgToggle()" aria-label="Play ya Pause">⏸</button>'+
    '<button class="tgb" type="button" onclick="tgSkip(1)" title="Agla step" aria-label="Agla step">▶</button>'+
    '<button class="tgb" type="button" onclick="tgChap(1)" title="Agla tab" aria-label="Agla tab">⏭</button>'+
    '<select id="tgsel" onchange="tgJump(this.value)" aria-label="Tab chuno"></select>'+
    (hasV?'<label class="tgvl"><input type="checkbox" id="tgvon" onchange="tgVoiceOn(this)"'+(GT.voice?' checked':'')+'> Voice</label><select id="tgvsel" onchange="tgVoicePick(this)" aria-label="Voice"></select>'+
    '<select id="tgrate" onchange="tgRate(this)" aria-label="Speed"><option value="0.9">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select>':'')+
    '</div>';
  document.body.appendChild(d);
  var s=document.createElement('div');s.id='tgspot';document.body.appendChild(s);
  $('tgsel').innerHTML=GT.ch.map(function(c,i){return '<option value="'+i+'">'+(i+1)+'. '+esc(c.label)+'</option>';}).join('');
}
function tgDockUpdate(){
  if(!$('tgdock'))return;

function tgPlace(){

  var el=GT.cur.el;
  if(!el||!document.body.contains(el)||!tgVis(el))el=GT.cur.el=tgFind(GT.cur.find);
  if(!el){sp.style.display='none';return;}
  var r=el.getBoundingClientRect(),pad=6;
  var d=$('tgdock');
  if(d){
    d.classList.remove('top');

    }
  }
  sp.style.display='block';
  sp.style.left=(r.left-pad)+'px';sp.style.top=(r.top-pad)+'px';
  sp.style.width=(r.width+pad*2)+'px';sp.style.height=(r.height+pad*2)+'px';
