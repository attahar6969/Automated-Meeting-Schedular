      text:"Yeh left menu hai. Ab ek ek karke har page ka kaam batate hain. Mobile par upar ka menu button dabane se yahi menu khulta hai.",
      en:"This is the left menu. Now we will go through the work of each page one by one. On mobile, the menu button at the top opens this same menu."}
  ];
  (typeof NAV!=="undefined"?NAV:[]).forEach(function(n){
    if(n[0]==="-")return;
    var g=GUIDE_TEXT[n[0]]||{};
    var info=g.intro||n[2]||"Yeh page menu se khulta hai. Iski jaankari agle chapter me milegi.";
    out.push({find:'.nav[data-v="'+n[0]+'"]',keep:true,text:n[1]+". "+info,en:n[1]+". "+(INTRO_EN[n[0]]||"This page opens from the menu. Its details come in the next chapter.")});
  });
  out.push({find:".who",keep:true,text:"Sabse neeche aapka login e-mail aur role dikhta hai.",en:"At the bottom you see your login e-mail and role."});
  return out;
}
function tgBuild(ch){
  if(ch.id==="_menu")return tgMenuStepsX();
  var g=GUIDE_TEXT[ch.id],out=[],en=GUIDE_EN[ch.id]||[];
  if(g&&g.steps&&g.steps.length)out=g.steps.map(function(o,i){var s=tgMk(o);s.en=en[i]||null;return s;});
  else out.push({find:"#main .top h1",keep:true,text:ch.label+". "+(ch.intro||"Yeh page menu se khulta hai."),en:ch.label+". "+(INTRO_EN[ch.id]||"This page opens from the menu.")});
  out.push({auto:"page"});
  return out;
}

/* ---- pick the text language ---- */
function tgTxt(st,el){
  var t=(GT.lang==="en"&&st.en!=null&&st.en!=="")?st.en:st.text;
  try{if(typeof t==="function")t=t(el);}catch(e){t="";}
  t=String(t||"");
  var lab=el?tgNorm(el.textContent).replace(/[▾▴↑↓●×]/g,"").trim().slice(0,40):"";
  return t.replace(/\{txt\}/g,lab);
}

/* ---- pick the voice for the language ---- */
function tgVoice(){
  var vs=GT.voices;if(!vs||!vs.length)return null;
  function pick(re){return vs.filter(function(v){return re.test(v.lang);})[0];}
  var r;
  if(GT.lang==="en")r=pick(/^en[-_]IN/i)||pick(/^en[-_]GB/i)||pick(/^en/i);
  else r=pick(/^hi/i)||pick(/^en[-_]IN/i)||pick(/^en/i);
  return r||vs[0];
}
function tgSpeak(text,tok,done){
  var est=Math.max(3500,text.length*58/GT.rate),fired=false,t0=Date.now(),ss=window.speechSynthesis;
  function fin(){
    if(fired||tok!==GT.tok||!GT.play||!GT.on)return;
    fired=true;clearTimeout(GT.timer);done();
  }
  function endSoon(){setTimeout(fin,Math.max(450,est*0.55-(Date.now()-t0)));}
  if(GT.voice&&ss){
    setTimeout(function(){
      if(tok!==GT.tok||!GT.play)return;
      var v=tgVoice();
      var parts=(text.match(/[^.!?।]+[.!?।]*/g)||[text]).map(function(p){return p.trim();}).filter(Boolean);
      parts.forEach(function(p,i){
        var u=new SpeechSynthesisUtterance(p);
        u.lang=v?v.lang:(GT.lang==="en"?"en-IN":"hi-IN");if(v)u.voice=v;u.rate=GT.rate;
        if(i===parts.length-1){u.onend=endSoon;u.onerror=endSoon;}
        ss.speak(u);
      });
    },90);
    GT.timer=setTimeout(fin,est*2.8+2500);
  }else{
    GT.timer=setTimeout(fin,est);
  }
}

/* ---- language switch ---- */
function tgLang(v){
  GT.lang=(v==="en")?"en":"hi";
  var a=$("tglang"),b=$("tglang0");
  if(a)a.value=GT.lang;if(b)b.value=GT.lang;
  if(GT.on&&GT.play)tgRun();
}

/* ---- guide bar: language choice replaces the long voice list ---- */
function tgBuildDock(){
  if($("tgdock"))return;
  GT.min=false;
  var d=document.createElement("div");d.id="tgdock";d.setAttribute("role","region");d.setAttribute("aria-label","Instructions guide");
  var hasV=!!window.speechSynthesis;
  d.innerHTML='<div class="tgtop"><b id="tgchap"></b><span id="tgcnt"></span>'+
    '<button class="tgx" id="tgmin" type="button" onclick="tgMin()" aria-label="Minimize guide" title="Minimize">–</button>'+
    '<button class="tgx" type="button" onclick="tgClose()" aria-label="Guide band karo" title="Close">✕</button></div>'+
    '<div class="tgsub" id="tgsub" aria-live="polite" title="Tap to expand" onclick="this.classList.toggle(\'open\')"></div>'+
    '<div class="tgbar"><i id="tgprog"></i></div>'+
    '<div class="tgctl">'+
    '<button class="tgb" type="button" onclick="tgChap(-1)" title="Previous tab" aria-label="Previous tab">⏮</button>'+
    '<button class="tgb" type="button" onclick="tgSkip(-1)" title="Previous step" aria-label="Previous step">◀</button>'+
    '<button class="tgb pri" type="button" id="tgplay" onclick="tgToggle()" aria-label="Play or Pause">⏸</button>'+
    '<button class="tgb" type="button" onclick="tgSkip(1)" title="Next step" aria-label="Next step">▶</button>'+
    '<button class="tgb" type="button" onclick="tgChap(1)" title="Next tab" aria-label="Next tab">⏭</button>'+
    '<button class="tgb" id="tggear" type="button" onclick="tgGear()" title="Tab, language, speed" aria-label="Settings" style="margin-left:auto">⚙</button>'+
    '</div>'+
    '<div class="tgset" id="tgset"><select id="tgsel" onchange="tgJump(this.value)" aria-label="Choose tab"></select>'+
    '<select id="tglang" onchange="tgLang(this.value)" aria-label="Guide language"><option value="hi">Hinglish</option><option value="en">English</option></select>'+
    (hasV?'<label class="tgvl"><input type="checkbox" id="tgvon" onchange="tgVoiceOn(this)"'+(GT.voice?' checked':'')+'> Voice</label>'+
      '<select id="tgrate" onchange="tgRate(this)" aria-label="Speed"><option value="0.9">Slow</option><option value="1" selected>Normal</option><option value="1.2">Fast</option></select>':'')+
    '</div>';
  document.body.appendChild(d);
  var s=document.createElement("div");s.id="tgspot";document.body.appendChild(s);
  $("tgsel").innerHTML=GT.ch.map(function(c,i){return '<option value="'+i+'">'+(i+1)+'. '+esc(c.label)+'</option>';}).join("");
  $("tglang").value=GT.lang;
}
/* ===== SPEED ===== */
var CACHE={};
var READS={getDashboardData:30000,dashSyncStatus:45000,appGetSettings:300000,appGetLists:300000,dashHealth:120000,
  appBootstrap:0,appBranding:0,dashList:0,dashResetPreview:0,appWho:0};

function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function clone(v){try{return JSON.parse(JSON.stringify(v));}catch(e){return v;}}
function persist(){if(S.boot)lsSet('ke_cache_v1',{boot:S.boot,data:S.data});}

function callRaw(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no(e);});r[fn].apply(r,a);});}

function call(fn){
  var a=[].slice.call(arguments,1);
  if(!(fn in READS)){CACHE={};return callRaw.apply(null,arguments);}
  var ttl=READS[fn];
  if(!ttl)return callRaw.apply(null,arguments);
  var key=fn+'|'+JSON.stringify(a),e=CACHE[key];
  if(e&&Date.now()-e.t<ttl)return e.p.then(clone);
  var p=callRaw.apply(null,arguments);
  CACHE[key]={t:Date.now(),p:p};
  p.then(function(v){if(fn==='getDashboardData')lsSet('ke_dash',v);},function(){delete CACHE[key];});
  if(fn==='getDashboardData'&&!window.__dashSwr){
    window.__dashSwr=1;
    var st=lsGet('ke_dash');
    if(st){
      p.then(function(){setTimeout(function(){if(S.view==='overview'&&!$('modalHost').innerHTML&&!S.menu&&!GT.on)renderOverview(true);},0);});
      return Promise.resolve(st);
    }
  }
  return p.then(clone);
}

function softRefresh(){
  if(!S.boot||$('modalHost').innerHTML||S.menu||GT.on)return;
  var ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
  if(S.view==='overview')renderOverview(true);else if(S.data[S.view])renderList(S.view);
}
function warm(){['dashSyncStatus','appGetSettings'].forEach(function(f){call(f).catch(function(){});});}

function boot(){
  var ENT=['meeting','minutes','action','followup','customer'];
  var c=lsGet('ke_cache_v1'),painted=false;
  if(c&&c.boot&&c.data&&c.boot.brand&&!c.boot.needsSetup){
    try{
      S.boot=c.boot;ENT.forEach(function(n){S.data[n]=c.data[n]||[];});
      applyBrand(c.boot.brand);buildNav();go(S.view);painted=true;
    }catch(e){painted=false;}
  }
  if(!painted){callRaw('appBranding').then(applyBrand).catch(function(){});call('getDashboardData').catch(function(){});}
  var pB=callRaw('appBootstrap'),pD=ENT.map(function(n){return callRaw('dashList',n);});
  return Promise.all([pB].concat(pD)).then(function(r){
    var b=r[0];
    S.boot=b;applyBrand(b.brand);
    if(b.needsSetup){lsSet('ke_cache_v1',null);return renderSetup();}
    ENT.forEach(function(n,i){S.data[n]=r[i+1];});
    persist();
    if(!painted){buildNav();go(S.view);}
    else{$('who').textContent=(b.user||'')+(b.role?' · '+b.role.toLowerCase():'');softRefresh();}
    setTimeout(warm,2500);
  }).catch(function(e){if(!painted)showFatal(e);});
}

function saveForm(n,id){
  var data={},err=$('ferr'),btn=$('fsave');err.textContent='';
  FORMS[n].forEach(function(f){var e=$('f_'+f.k);if(e)data[f.k]=e.value;});
  var missing=FORMS[n].filter(function(f){
    if(!f.req)return false;
    if(id&&n==='meeting'&&(f.k==='custName'||f.k==='custMobile'))return false;
    return !String(data[f.k]||'').trim();
  }).map(function(f){return f.l;});
  if(missing.length){err.textContent='Required: '+missing.join(', ');return;}
  if(id)data.id=id;
  var sc=$('f_saveCustomer');if(sc)data.saveCustomer=sc.checked;
  if(n==='meeting'){
    var fd=$('f_fuDate'),fsub=$('f_fuSubject'),ft=$('f_fuType'),fst=$('f_fuStatus'),fid=$('f_fuId');
    if(fd&&fd.value){data.fuDate=fd.value;data.fuSubject=fsub.value;data.fuType=ft.value;data.fuStatus=fst.value;data.fuId=fid.value;}
    else if(fid&&fid.value){err.textContent='Follow-up date is required. To drop this follow-up, set its status to Cancelled.';return;}
    else if(fsub&&fsub.value.trim()){err.textContent='Enter the follow-up date, or clear the follow-up note.';return;}
  }
  btn.disabled=true;btn.textContent='Saving…';
  call('dashSave',n,data).then(function(r){
    var arr=S.data[n],i=arr.findIndex(function(x){return x.id===r.id;});
    if(i>=0)arr[i]=r.record;else arr.push(r.record);
    closeModal();
    toast(r.followupError?r.followupError:'Saved '+r.id,!!r.followupError);
    if(S.view==='overview')renderOverview(true);else if(S.view===n)renderList(n);else go(n);
    persist();
    var jobs=[];
    if(n==='meeting'&&data.saveCustomer)jobs.push(refreshEntity('customer').catch(function(){}));
    if(data.fuDate)jobs.push(refreshEntity('followup').catch(function(){}));
    if(jobs.length)Promise.all(jobs).then(function(){persist();softRefresh();});
  }).catch(function(e){btn.disabled=false;btn.textContent='Save';err.textContent=e.message||String(e);});
}

function setStatus(n,id,v){
  var arr=S.data[n],i=arr.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var old=arr[i],nu=Object.assign({},old,{status:v});
  if(n==='followup'&&v==='Completed')nu.completedDate=todayISO();
  arr[i]=nu;
  if(S.view!=='overview'){toast('Updated '+id);renderList(S.view);}else toast('Saving '+id+'…');
  call('dashSave',n,{id:id,status:v}).then(function(r){
    var j=S.data[n].findIndex(function(x){return x.id===id;});
    if(j>=0)S.data[n][j]=r.record;
    persist();
    if(S.view==='overview'){toast('Updated '+id);renderOverview(true);}else softRefresh();
  }).catch(function(e){
    var j=S.data[n].findIndex(function(x){return x.id===id;});
    if(j>=0)S.data[n][j]=old;
    toast(e.message||e,1);softRefresh();
  });
}
function markDone(n,id){setStatus(n,id,'Completed');}

function doneFollow(id,btn){
  var arr=S.data.followup,i=arr.findIndex(function(x){return x.id===id;});
  if(i<0)return;
  var old=arr[i];
  arr[i]=Object.assign({},old,{status:'Completed',completedDate:todayISO()});
  toast('Follow-up marked done');
  if(S.view==='meeting')renderList('meeting');
  call('dashSave','followup',{id:id,status:'Completed'}).then(function(r){
    var j=S.data.followup.findIndex(function(x){return x.id===id;});
    if(j>=0)S.data.followup[j]=r.record;
    persist();softRefresh();
  }).catch(function(e){
    var j=S.data.followup.findIndex(function(x){return x.id===id;});
    if(j>=0)S.data.followup[j]=old;
    toast(e.message||e,1);softRefresh();
  });
}

function delRec(n,id,btn){
  if(!confirm('Delete '+id+(n==='meeting'?' and its follow-ups':'')+'? This cannot be undone.'))return;
  var bk=S.data[n],bf=S.data.followup;
  S.data[n]=S.data[n].filter(function(x){return x.id!==id;});
  if(n==='meeting')S.data.followup=S.data.followup.filter(function(x){return x.meetingId!==id;});
  renderList(n);
  toast('Deleting '+id+'…');
  call('dashDelete',n,id).then(function(){
    persist();toast('Deleted '+id);
  }).catch(function(e){
    S.data[n]=bk;S.data.followup=bf;
    toast(e.message||e,1);softRefresh();
  });
}
boot();
